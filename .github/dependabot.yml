version: 2
updates:
  # This repo pins its actions to commit SHAs. Without this, pinning would mean
  # going stale: Dependabot rewrites the pin to the new commit and updates the
  # trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait a week before proposing a new release. A compromised or broken
    # action release is usually caught and yanked inside that window.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
