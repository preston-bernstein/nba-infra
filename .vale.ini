# Vale config for the writing pack. Copy to .vale.ini in the repo root, with templates/styles as .vale/styles.
# The House styles are generated from Preston's rule table (scripts/gen_vale_house.py); Google and write-good are the
# few vendored rules that held up on real READMEs. Only `error` rules fail the gate. Warnings print and pass.
StylesPath = .vale/styles
MinAlertLevel = warning
IgnoredScopes = code, tt

[*.md]
BasedOnStyles = House, HouseDocs, Google, write-good
Google.Latin = warning

[*.{py,js,jsx,ts,tsx,go,java,rs,rb,c,h,cc,cpp,css,swift}]
BasedOnStyles = House, HouseNotes
