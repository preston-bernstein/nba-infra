# Kafka layer for the desktop instance. Use it on top of docker-compose.desktop.yml:
#   docker compose -f docker-compose.desktop.yml -f docker-compose.kafka.yml up -d --build
# docker-compose.desktop.yml is not changed. Nothing is published on the host.
# Sibling repos are found under REPOS_DIR (default ..). On a host where the repos sit
# next to the live compose file, run from that folder with REPOS_DIR=. and
#   docker compose -f docker-compose.yml -f nba-infra/docker-compose.kafka.yml up -d --build
# Log rotation: Docker keeps container logs forever without it. Pack: logging, rule log-compose-rotation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits, no-restart]  # no health endpoint is defined yet; add one with the service; real memory use not measured yet; set mem_limit from observed use; restart is handled by the deploy script or a one-shot job
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  go-feed:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits, no-restart]  # no health endpoint is defined yet; add one with the service; real memory use not measured yet; set mem_limit from observed use; restart is handled by the deploy script or a one-shot job
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  predictor-consumer:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits]  # no health endpoint is defined yet; add one with the service; real memory use not measured yet; set mem_limit from observed use
    build:
      context: ${REPOS_DIR:-..}/nba-predictor
      dockerfile: Dockerfile.dev
    environment:
      NBA_DATA_DIR: /work/data_cache
      NBA_ART_DIR: /work/artifacts
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ${PREDICTOR_DATA_CACHE:-predictor-data-cache}:/work/data_cache
      - ${PREDICTOR_ARTIFACTS:-predictor-artifacts}:/work/artifacts
    command: ["python", "-m", "src.events.consumer"]
    restart: unless-stopped

  kafka:
    logging:
      <<: *default-logging
    x-docker-allow: [no-limits]  # real memory use not measured yet; set mem_limit from observed use
    image: apache/kafka:3.8.1@sha256:22c4bea38875408e8f9fe52aca8e3a6ee67f9aa0090db59af99a2f6647558db5
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits, no-restart]  # no health endpoint is defined yet; add one with the service; real memory use not measured yet; set mem_limit from observed use; restart is handled by the deploy script or a one-shot job
    image: apache/kafka:3.8.1@sha256:22c4bea38875408e8f9fe52aca8e3a6ee67f9aa0090db59af99a2f6647558db5
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/kafka/bin/kafka-topics.sh
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic game.updated --partitions 3 --replication-factor 1
        $$T --bootstrap-server kafka:9092 --create --if-not-exists --topic game.updated.dlq --partitions 1 --replication-factor 1
        $$T --bootstrap-server kafka:9092 --list

volumes:
  kafka-data:
