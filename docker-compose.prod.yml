# Log rotation: Docker keeps container logs forever without it. Pack: logging, rule log-compose-rotation.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  proxy:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits, no-restart]  # healthcheck needs a probe endpoint in the sibling repo; mem_limit needs measured memory use first; restart policy for the TLS proxy is a deploy decision
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

  api:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits]  # healthcheck needs a probe endpoint in the sibling repo; mem_limit needs measured memory use first
    environment:
      NODE_ENV: production
    restart: unless-stopped

  go-feed:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits]  # healthcheck needs a probe endpoint in the sibling repo; mem_limit needs measured memory use first
    restart: unless-stopped

  predictor:
    logging:
      <<: *default-logging
    x-docker-allow: [no-healthcheck, no-limits]  # healthcheck needs a probe endpoint in the sibling repo; mem_limit needs measured memory use first
    volumes:
      - ${PREDICTOR_DATA_CACHE:-predictor-data-cache}:/work/data_cache
      - ${PREDICTOR_ARTIFACTS:-predictor-artifacts}:/work/artifacts
    restart: unless-stopped

volumes:
  predictor-data-cache:
  predictor-artifacts:
  caddy_data:
  caddy_config:
