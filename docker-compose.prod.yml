services:
  proxy:
    ports:
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]

  api:
    environment:
      NODE_ENV: production
    restart: unless-stopped

  go-feed:
    restart: unless-stopped

  predictor:
    volumes:
      - ${PREDICTOR_DATA_CACHE:-predictor-data-cache}:/work/data_cache
      - ${PREDICTOR_ARTIFACTS:-predictor-artifacts}:/work/artifacts
    restart: unless-stopped

volumes:
  predictor-data-cache:
  predictor-artifacts:
  caddy_data:
  caddy_config:
